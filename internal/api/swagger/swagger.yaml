basePath: /
consumes:
- application/json
definitions:
  action.Request:
    properties:
      action:
        description: 'Action specifies the operation: "start", "stop", "restart",
          or "set_tag".'
        type: string
      image:
        description: Image is an alias for Tag.
        type: string
      tag:
        description: Tag specifies the new image tag or full reference when Action
          is "set_tag".
        type: string
    type: object
  action.Response:
    properties:
      action:
        type: string
      container:
        type: string
      message:
        type: string
      status:
        type: string
    type: object
  activity.Container:
    properties:
      image:
        description: Image is the image reference the container is updated to.
        type: string
      name:
        description: Name is the container name.
        type: string
      pull:
        allOf:
        - $ref: '#/definitions/activity.Pull'
        description: Pull is the download progress of the container's image while
          Step is pulling.
      since:
        description: Since is when the container entered this step, in RFC 3339.
        type: string
      step:
        description: Step is one of the Step constants.
        type: string
    type: object
  activity.FinishedScan:
    properties:
      containers:
        description: Containers is the final step of each container the scan worked
          on.
        items:
          $ref: '#/definitions/activity.Container'
        type: array
      finished_at:
        description: FinishedAt is when the scan ended, in RFC 3339.
        type: string
    type: object
  activity.Pull:
    properties:
      downloaded_bytes:
        description: DownloadedBytes is the number of bytes downloaded across reported
          layers.
        type: integer
      layers:
        description: Layers is the number of layers Docker has reported so far.
        type: integer
      layers_done:
        description: LayersDone counts layers that are downloaded and unpacked.
        type: integer
      layers_downloaded:
        description: LayersDownloaded counts layers that have finished downloading.
        type: integer
      phase:
        description: Phase is one of the Phase constants.
        type: string
      total_bytes:
        description: |-
          TotalBytes is the download size of the layers reported so far. It can
          grow while the pull runs, because Docker reports sizes as layers start.
        type: integer
    type: object
  check.CheckResponse:
    properties:
      api_version:
        type: string
      containers:
        items:
          $ref: '#/definitions/check.ContainerCheck'
        type: array
      count:
        type: integer
      timestamp:
        type: string
    type: object
  check.ContainerCheck:
    properties:
      changelog:
        type: string
      current_image_version:
        type: string
      current_revision:
        type: string
      digest:
        type: string
      documentation:
        type: string
      error:
        type: string
      git_commit:
        type: string
      git_ref:
        type: string
      git_repo:
        type: string
      image:
        type: string
      image_id:
        type: string
      image_url:
        type: string
      latest_digest:
        type: string
      latest_image_id:
        type: string
      latest_image_version:
        type: string
      latest_revision:
        type: string
      name:
        type: string
      oci_source:
        type: string
      timestamp:
        type: string
      update_available:
        type: boolean
      update_source:
        type: string
    type: object
  check.LatestResponse:
    properties:
      api_version:
        description: APIVersion is the API version of the response.
        type: string
      checked_at:
        description: CheckedAt is when the most recent check or scan finished, or
          null before the first one.
        type: string
      containers:
        description: Containers holds the latest known status of each container.
        items:
          $ref: '#/definitions/metrics.ContainerStatus'
        type: array
      count:
        description: Count is the number of containers.
        type: integer
      timestamp:
        description: Timestamp is when the response was produced.
        type: string
    type: object
  github_com_nicholas-fedor_watchtower_internal_api_handlers_settings.NotificationService:
    properties:
      host:
        description: Host is the server the service sends to, when the URL names one.
        type: string
      id:
        description: ID identifies the service. It reveals nothing about the URL.
        type: string
      name:
        description: Name is the label given when the service was added, if any.
        type: string
      service:
        description: Service is the Shoutrrr service, such as "ntfy" or "discord".
        type: string
      source:
        description: |-
          Source is "config" for services set by flags or environment variables,
          which cannot be removed here, or "settings" for services added at run time.
        type: string
    type: object
  metrics.ContainerStatus:
    properties:
      changelog:
        type: string
      checked_by:
        description: CheckedBy is StatusSourceCheck or StatusSourceScan.
        type: string
      current_image_version:
        type: string
      error:
        type: string
      git_ref:
        type: string
      git_repo:
        type: string
      image:
        type: string
      image_id:
        type: string
      latest_digest:
        type: string
      latest_image_id:
        type: string
      latest_image_version:
        type: string
      name:
        type: string
      oci_source:
        type: string
      timestamp:
        type: string
      update_available:
        type: boolean
    type: object
  settings.AddNotificationRequest:
    properties:
      name:
        description: Name is an optional label for the service.
        type: string
      url:
        description: URL is the Shoutrrr service URL.
        type: string
    type: object
  settings.NotificationsResponse:
    properties:
      api_version:
        description: APIVersion is the API version of the response.
        type: string
      saved:
        description: Saved is true when added services are written to the data directory
          and survive a restart.
        type: boolean
      services:
        description: Services lists every notification destination.
        items:
          $ref: '#/definitions/github_com_nicholas-fedor_watchtower_internal_api_handlers_settings.NotificationService'
        type: array
      timestamp:
        description: Timestamp is when the response was produced.
        type: string
    type: object
  settings.Response:
    properties:
      api_version:
        description: APIVersion is the API version of the response.
        type: string
      next_run:
        description: NextRun is when the next scheduled scan starts, omitted when
          none is scheduled.
        type: string
      saved:
        description: Saved is true when changes are written to the data directory
          and survive a restart.
        type: boolean
      schedule_active:
        description: ScheduleActive is false when Watchtower only updates on request,
          so the schedule has no effect.
        type: boolean
      settings:
        additionalProperties:
          $ref: '#/definitions/settings.Setting'
        description: Settings maps each setting name to its state.
        type: object
      timestamp:
        description: Timestamp is when the response was produced.
        type: string
    type: object
  settings.Setting:
    properties:
      changed:
        description: Changed is true when the value was set at run time instead of
          by a flag.
        type: boolean
      default:
        description: Default is the value from flags and environment variables.
      value:
        description: Value is the value in force.
    type: object
  settings.TestNotificationRequest:
    properties:
      message:
        type: string
      title:
        type: string
      url:
        type: string
    type: object
  update.StatusResponse:
    properties:
      api_version:
        description: APIVersion is the API version of the response.
        type: string
      containers:
        description: Containers lists what the scan is doing to each container it
          has started on.
        items:
          $ref: '#/definitions/activity.Container'
        type: array
      last_scan:
        allOf:
        - $ref: '#/definitions/activity.FinishedScan'
        description: LastScan is how the most recent scan ended. Omitted while a scan
          runs.
      running:
        description: Running is true while an update scan is in progress, scheduled
          or requested.
        type: boolean
      started_at:
        description: StartedAt is when the running scan began, in RFC 3339. Omitted
          when idle.
        type: string
      timestamp:
        description: Timestamp is when the response was produced.
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Nicholas Fedor
    url: https://github.com/nicholas-fedor/watchtower
  description: Watchtower HTTP API for container update management, metrics, and health
    probes.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: Watchtower HTTP API
  version: "1.0"
paths:
  /livez:
    get:
      description: Returns 200 OK if the Watchtower HTTP server is running. Used by
        orchestrators (e.g., Kubernetes) to determine if the process is alive.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: Returns 200 OK if the Watchtower HTTP server is running and the
        Docker client is connected and responsive. Used by orchestrators to determine
        if the service is ready to accept
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "503":
          description: Docker client not connected
          schema:
            type: string
      summary: Readiness probe
      tags:
      - health
  /startupz:
    get:
      description: Returns 200 OK if the Watchtower HTTP server has started. Used
        by orchestrators (e.g., Kubernetes) to determine if the process has finished
        startup.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Startup probe
      tags:
      - health
  /v1/check:
    get:
      description: Returns each container's status from the latest check or scan that
        looked at it, without contacting any registry.
      produces:
      - application/json
      responses:
        "200":
          description: Latest known container statuses
          schema:
            $ref: '#/definitions/check.LatestResponse'
        "401":
          description: Missing or invalid API token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Latest check results
      tags:
      - check
    post:
      consumes:
      - application/json
      description: Checks each watched container for available updates. Associated
        Git-watched containers compare the hosted Git ref (no clone or build). Other
        containers query the registry for the
      parameters:
      - description: Image names to check (comma-separated, repeatable). When combined
          with container, only containers matching both are checked.
        in: query
        name: image
        type: string
      - description: Container names to check (comma-separated, repeatable). When
          combined with image, only containers matching both are checked.
        in: query
        name: container
        type: string
      - description: Per-request timeout override (e.g. 30s, 2m). Bounded by the configured
          check API timeout.
        in: query
        name: timeout
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Container update availability results
          schema:
            $ref: '#/definitions/check.CheckResponse'
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "500":
          description: Failed to check for updates
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Check for available container updates
      tags:
      - check
  /v1/config:
    get:
      consumes:
      - application/json
      description: Returns the active Watchtower configuration settings. Sensitive
        values (notification URLs, tokens) are redacted.
      produces:
      - application/json
      responses:
        "200":
          description: Config object with timestamp and api_version
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "500":
          description: Failed to get configuration
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get current configuration
      tags:
      - config
  /v1/containers:
    get:
      consumes:
      - application/json
      description: Returns the current image identity and digest for every watched
        container. Optionally filter by container name or image name.
      parameters:
      - description: Filter by container name (exact match)
        in: query
        name: name
        type: string
      - description: Filter by image name (exact match)
        in: query
        name: image
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Container statuses with count and timestamp
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "500":
          description: Failed to list containers
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List watched container statuses
      tags:
      - containers
  /v1/containers/{name}/action:
    post:
      consumes:
      - application/json
      description: Performs start, stop, restart, or image tag change (set_tag) on
        a container.
      parameters:
      - description: Container name
        in: path
        name: name
        required: true
        type: string
      - description: Action request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/action.Request'
      produces:
      - application/json
      responses:
        "200":
          description: Action executed successfully
          schema:
            $ref: '#/definitions/action.Response'
        "400":
          description: Invalid request or action
          schema:
            type: string
        "404":
          description: Container not found
          schema:
            type: string
        "500":
          description: Failed to execute action
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Perform container lifecycle action
      tags:
      - containers
  /v1/containers/details:
    get:
      consumes:
      - application/json
      description: Returns detailed information about each watched container, including
        running state, image identity, and configuration flags. Optionally filter
        by container name or image name.
      parameters:
      - description: Filter by container name (exact match)
        in: query
        name: name
        type: string
      - description: Filter by image name (exact match)
        in: query
        name: image
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Container details with count and timestamp
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "500":
          description: Failed to get container details
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Detailed container status
      tags:
      - containers
  /v1/events:
    get:
      description: |-
        Streams Watchtower operational events (scan started/completed, update started/completed/failed) via Server-Sent Events (SSE).

        **SSE is not supported by "Try it out"**.
      produces:
      - text/event-stream
      responses:
        "200":
          description: Event stream (SSE)
          schema:
            type: string
        "401":
          description: Missing or invalid events token
          schema:
            type: string
      security:
      - EventsToken: []
      summary: Real-time events stream
      tags:
      - events
  /v1/history:
    get:
      consumes:
      - application/json
      description: Returns historical scan results from the in-memory ring buffer
        (up to 500 entries). Optionally filter by time range and limit the number
        of results.
      parameters:
      - description: Include entries at or after this RFC3339 timestamp
        in: query
        name: since
        type: string
      - description: Include entries at or before this RFC3339 timestamp
        in: query
        name: until
        type: string
      - description: 'Maximum number of entries to return (default: all)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: History entries with count and timestamp
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid query parameter
          schema:
            type: string
        "401":
          description: Missing or invalid API token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Scan history
      tags:
      - history
  /v1/images:
    get:
      consumes:
      - application/json
      description: Returns the current image identity and digest for every image tracked
        by Watchtower. Optionally filter by image name or image ID.
      parameters:
      - description: Filter by image name (exact match)
        in: query
        name: name
        type: string
      - description: Filter by image ID (sha256:...)
        in: query
        name: id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Image statuses with count and timestamp
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "500":
          description: Failed to list images
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List tracked images
      tags:
      - images
  /v1/metrics:
    get:
      description: Returns Watchtower scan metrics in Prometheus exposition format.
      produces:
      - text/plain
      responses:
        "200":
          description: Prometheus exposition format metrics
          schema:
            type: string
        "401":
          description: Missing or invalid API token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Prometheus metrics
      tags:
      - metrics
  /v1/settings:
    get:
      description: Returns the settings that can be changed at run time, with each
        one's value, default, and whether it was changed.
      produces:
      - application/json
      responses:
        "200":
          description: Runtime settings
          schema:
            $ref: '#/definitions/settings.Response'
        "401":
          description: Missing or invalid API token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get runtime settings
      tags:
      - settings
    patch:
      consumes:
      - application/json
      description: 'Changes the named settings: monitor_only, cleanup, rolling_restart,
        auto_rollback, include_stopped (booleans), schedule (cron) and container_overrides
        (map). JSON null resets one.'
      parameters:
      - description: Setting names mapped to new values
        in: body
        name: changes
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Runtime settings after the change
          schema:
            $ref: '#/definitions/settings.Response'
        "400":
          description: The change was rejected
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "500":
          description: The change could not be persisted
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change runtime settings
      tags:
      - settings
  /v1/settings/notifications:
    get:
      description: Lists notification services without their URLs. Source is "config"
        for flags and environment variables, "settings" for services added here.
      produces:
      - application/json
      responses:
        "200":
          description: Notification services
          schema:
            $ref: '#/definitions/settings.NotificationsResponse'
        "401":
          description: Missing or invalid API token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: List notification services
      tags:
      - settings
    post:
      consumes:
      - application/json
      description: Adds a Shoutrrr notification URL, such as ntfy://ntfy.sh/topic,
        in addition to any set by flags. It is saved in the data directory when one
        is mounted.
      parameters:
      - description: Service to add
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/settings.AddNotificationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Notification services after the change
          schema:
            $ref: '#/definitions/settings.NotificationsResponse'
        "400":
          description: Invalid URL
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "409":
          description: The service is already set up
          schema:
            additionalProperties: true
            type: object
        "500":
          description: The change could not be saved
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Add a notification service
      tags:
      - settings
  /v1/settings/notifications/{id}:
    delete:
      description: Removes a notification service that was added through the HTTP
        API. Services set by flags or environment variables cannot be removed here.
      parameters:
      - description: Service ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Notification services after the change
          schema:
            $ref: '#/definitions/settings.NotificationsResponse'
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "404":
          description: No service added at run time has this ID
          schema:
            additionalProperties: true
            type: object
        "500":
          description: The change could not be saved
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Remove a notification service
      tags:
      - settings
  /v1/settings/test-notification:
    post:
      consumes:
      - application/json
      description: Sends an immediate test alert to verify notification services.
        Optionally accepts a custom URL, title, or message.
      parameters:
      - description: Notification parameters
        in: body
        name: body
        schema:
          $ref: '#/definitions/settings.TestNotificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Notification test result
          schema:
            additionalProperties: true
            type: object
        "400":
          description: No URLs configured or invalid request
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Delivery failed
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Test notification delivery
      tags:
      - settings
  /v1/status:
    get:
      consumes:
      - application/json
      description: Returns the summary of the most recent Watchtower scan, including
        counts of scanned, updated, failed, restarted, and skipped containers.
      produces:
      - application/json
      responses:
        "200":
          description: Scan summary with counts and timestamp
          schema:
            additionalProperties: true
            type: object
        "204":
          description: No Content
        "401":
          description: Missing or invalid API token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Last scan status
      tags:
      - metrics
  /v1/update:
    post:
      consumes:
      - application/json
      description: Scans watched containers for image updates and applies them. Supports
        both full scans and targeted updates filtered by image name or container name.
        Container patterns support Go
      parameters:
      - description: Comma-separated image names to update (repeatable)
        in: query
        name: image
        type: string
      - description: Container name patterns to update (repeatable, supports Go regex)
        in: query
        name: container
        type: string
      - description: When 'true', runs update asynchronously and returns 202 Accepted
        in: query
        name: async
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Synchronous update results with summary and timing
          schema:
            additionalProperties: true
            type: object
        "202":
          description: Asynchronous update accepted
          schema:
            type: string
        "401":
          description: Missing or invalid API token
          schema:
            type: string
        "429":
          description: Another update is already running
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: string
          schema:
            type: string
        "503":
          description: Request cancelled while waiting for lock
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Trigger container update scan
      tags:
      - update
  /v1/update/status:
    get:
      description: Reports whether an update scan is running and, for each container
        it is working on, the current step (pulling, stopping, starting, updated,
        failed) and image download progress. Cheap to poll while an update runs.
      produces:
      - application/json
      responses:
        "200":
          description: Current update activity
          schema:
            $ref: '#/definitions/update.StatusResponse'
        "401":
          description: Missing or invalid API token
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Get update progress
      tags:
      - update
produces:
- application/json
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'Paste the HTTP API token only (WATCHTOWER_HTTP_API_TOKEN). Swagger
      UI sends it as the Authorization header value. curl clients should use "Authorization:
      Bearer <token>".'
    in: header
    name: Authorization
    type: apiKey
  EventsToken:
    description: Paste the events API token only (WATCHTOWER_HTTP_API_EVENTS_TOKEN).
      Swagger UI sends it as the Authorization header value.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
