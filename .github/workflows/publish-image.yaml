---
name: Publish Container Image

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - cmd/**
      - internal/**
      - pkg/**
      - build/docker/**
      - go.mod
      - go.sum
      - main.go
      - .github/workflows/publish-image.yaml

permissions:
  contents: read # Set default read-only permissions

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and Push to GHCR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # For code checkout
      packages: write # For pushing the image to ghcr.io
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Dockerfile derives the version from git describe.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          short_sha="${COMMIT_SHA::7}"
          # Only main publishes. "latest" is the tag to run; sha-<short> pins
          # a specific build for rollback.
          tags=(--tag "${image}:latest" --tag "${image}:sha-${short_sha}")

          docker buildx build \
            --file build/docker/Dockerfile.self-local \
            --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.source=${SERVER_URL}/${REPOSITORY}" \
            --label "org.opencontainers.image.url=${SERVER_URL}/${REPOSITORY}" \
            --label "org.opencontainers.image.revision=${COMMIT_SHA}" \
            "${tags[@]}" \
            --push \
            .

